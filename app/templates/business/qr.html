 
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>QR Code - {{ business.name }}</title>

    <style>

        /* =========================================================
           Fonts
           ========================================================= */

        @font-face {
            font-family: Vazirmatn;
            src: url("{{ url_for('static', filename='font/Vazirmatn-Regular.woff2') }}");
        }

        @font-face {
            font-family: Vazirmatn;
            src: url("{{ url_for('static', filename='font/Vazirmatn-Bold.woff2') }}");
            font-weight: 700;
        }


        /* =========================================================
           Base
           ========================================================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 15px 12px;
            font-family: Vazirmatn, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }


        /* =========================================================
           Back Link
           ========================================================= */

        .back-link {
            display: inline-block;
            margin-bottom: 10px;
            color: #555;
            text-decoration: none;
            font-size: 13px;
        }


        /* =========================================================
           Main Card
           ========================================================= */

        .card {
            background: white;
            border-radius: 20px;
            padding: 18px 16px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
        }


        /* =========================================================
           Header
           ========================================================= */

        .icon {
            font-size: 30px;
            margin-bottom: 3px;
        }

        h1 {
            margin: 0 0 3px;
            font-size: 20px;
        }

        .business-type {
            color: #888;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .business-name {
            color: #555;
            font-size: 15px;
            margin-bottom: 8px;
            font-weight: 700;
        }


        /* =========================================================
           QR
           ========================================================= */

        .qr-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 8px auto 12px;
        }

        .qr-wrapper img {
            width: 220px;
            max-width: 65vw;
            height: auto;
            display: block;
            border-radius: 10px;
        }


        /* =========================================================
           Description
           ========================================================= */

        .description {
            color: #666;
            font-size: 12px;
            line-height: 1.6;
            margin-bottom: 10px;
        }


        /* =========================================================
           Public URL
           ========================================================= */

        .url-box {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 8px 10px;
            font-size: 11px;
            direction: ltr;
            word-break: break-all;
            color: #444;
        }


        /* =========================================================
           Actions
           ========================================================= */

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .action-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            background: #128904;
            color: white;
        }

        .action-button:hover {
            opacity: 0.9;
        }


        /* =========================================================
           Mobile
           ========================================================= */

        @media (max-width: 480px) {

            body {
                padding: 20px 12px;
            }

            .card {
                padding: 25px 15px;
            }

            h1 {
                font-size: 21px;
            }

            .qr-wrapper img {
                width: 250px;
            }
        }

    </style>
</head>


<body>

    <div class="container">

        <!-- Back -->
        <a
            href="{{ url_for('business.manage', business_id=business.id) }}"
            class="back-link"
        >
            ← بازگشت به مدیریت کسب‌وکار
        </a>


        <!-- Main Card -->
        <div class="card">

            <!-- Icon -->
            <div class="icon">
                📱
            </div>


            <!-- Title -->
            <h1>
                QR Code
            </h1>


            <!-- Business Type -->
            <div class="business-type">
                {{ business_config.icon }}
                {{ business_config.name }}
            </div>


            <!-- Business Name -->
            <div class="business-name">
                {{ business.name }}
            </div>


            <!-- QR Image -->
            <div class="qr-wrapper">

                <img
                    src="{{ url_for('static', filename=qr_path) }}"
                    alt="QR Code {{ business.name }}"
                >

            </div>


            <!-- Description -->
            <div class="description">
                این QR Code را می‌توانید برای مشتریان خود
                نمایش دهید تا با اسکن آن مستقیماً وارد
                صفحه عمومی کسب‌وکار شما شوند.
            </div>


            <!-- Public URL -->
            <div class="url-box">
                {{ public_url }}
            </div>


            <!-- Actions -->
            <div class="actions">

                <a
                    href="{{ url_for('business.download_qr_code', business_id=business.id) }}"
                    class="action-button"
                >
                    ⬇️ دانلود QR
                </a>

            </div>

        </div>

    </div>

</body>

</html>
