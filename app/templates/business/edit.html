<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ویرایش کسب‌وکار</title>

<style>

@font-face {
    font-family: Vazirmatn;
    src: url("{{ url_for('static', filename='font/Vazirmatn-Regular.woff2') }}");
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    font-family: Vazirmatn, Tahoma, sans-serif;

    background:
        linear-gradient(
            180deg,
            #eff6ff,
            #f5f7fb
        );

    color: #202124;
}

.container {
    width: 100%;
    max-width: 1000px;

    margin: 20px auto;

    padding: 15px;
}

.back {
    display: inline-block;

    margin-bottom: 18px;

    color: #555;

    text-decoration: none;

    font-size: 14px;

    transition: .2s;
}

.back:hover {
    color: #2563eb;
}

.card {
    background: white;

    border-radius: 24px;

    padding: 28px;

    box-shadow:
        0 15px 40px rgba(0, 0, 0, .08);
}

.header-icon {
    width: 70px;
    height: 70px;

    border-radius: 20px;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #eff6ff;

    font-size: 35px;

    margin-bottom: 18px;
}

h1 {
    margin: 0 0 25px;

    font-size: 26px;

    font-weight: 800;
}

.form-grid {
    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 18px;
}

.field {
    min-width: 0;
}

.field-full {
    grid-column: span 3;
}

.field-two {
    grid-column: span 2;
}

label {
    display: block;

    margin-bottom: 8px;

    font-size: 14px;

    font-weight: 700;
}

input,
textarea,
select {
    width: 100%;

    padding: 11px 12px;

    border: 1px solid #e5e7eb;

    border-radius: 14px;

    font-family: inherit;

    font-size: 15px;

    color: #202124;

    background: #fff;

    outline: none;

    transition: .2s;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #2563eb;

    box-shadow:
        0 0 0 3px rgba(37, 99, 235, .12);
}

textarea {
    min-height: 110px;

    resize: vertical;

    line-height: 1.8;
}

select {
    cursor: pointer;
}

.help {
    margin-top: 6px;

    color: #777;

    font-size: 12px;

    line-height: 1.7;
}

.message {
    padding: 12px 14px;

    border-radius: 12px;

    margin-bottom: 18px;

    font-size: 14px;
}

.message.error {
    background: #fee2e2;

    color: #991b1b;
}

.message.success {
    background: #dcfce7;

    color: #166534;
}

.form-actions {
    margin-top: 24px;

    padding-top: 20px;

    border-top: 1px solid #eee;
}

button {
    width: 100%;

    padding: 14px;

    border: 0;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #1d4ed8
        );

    color: white;

    font-size: 16px;

    font-weight: 700;

    font-family: inherit;

    cursor: pointer;

    transition: .2s;
}

button:hover {
    transform: translateY(-1px);

    box-shadow:
        0 8px 20px rgba(37, 99, 235, .20);
}

button:active {
    transform: translateY(0);
}

@media (max-width: 700px) {

    .container {
        margin: 12px auto;

        padding: 10px;
    }

    .card {
        padding: 22px 18px;

        border-radius: 20px;
    }

    .form-grid {
        grid-template-columns: 1fr;

        gap: 15px;
    }

    .field-full,
    .field-two {
        grid-column: span 1;
    }

    h1 {
        font-size: 23px;
    }

    .header-icon {
        width: 60px;
        height: 60px;

        font-size: 30px;
    }
}

</style>

</head>


<body>

<div class="container">


<a
    class="back"
    href="{{ url_for('dashboard.index') }}"
>
    ← بازگشت به داشبورد
</a>


<div class="card">


<div class="header-icon">
    ⚙️
</div>


<h1>
    ویرایش کسب‌وکار
</h1>


{% with messages = get_flashed_messages(with_categories=true) %}

    {% if messages %}

        {% for category, message in messages %}

            <div class="message {{ category }}">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}

{% endwith %}


<form method="POST">


<div class="form-grid">


<!-- نام کسب‌وکار -->

<div class="field">

<label>
    نام کسب‌وکار
</label>

<input
    type="text"
    id="name"
    name="name"
    value="{{ request.form.get('name', business.name) }}"
    required
>

</div>


<!-- نوع کسب‌وکار -->

<div class="field">

<label>
    نوع کسب‌وکار
</label>

<select
    id="business_type"
    name="business_type"
    required
>

{% for item in business_type_choices %}

<option
    value="{{ item.value }}"
    {% if request.form.get('business_type', business.business_type) == item.value %}
        selected
    {% endif %}
>
    {{ item.icon }} {{ item.name }}
</option>

{% endfor %}

</select>

</div>


<!-- آدرس اختصاصی -->

<div class="field">

<label>
    آدرس اختصاصی
</label>

<input
    type="text"
    id="slug"
    name="slug"
    value="{{ request.form.get('slug', business.slug) }}"
    required
>

<div class="help">
    این آدرس برای صفحه عمومی و QR Code استفاده خواهد شد.
</div>

</div>


<!-- توضیحات -->

<div class="field field-two">

<label>
    توضیحات
</label>

<textarea
    id="description"
    name="description"
    placeholder="توضیح کوتاهی درباره کسب‌وکار..."
>{{ request.form.get('description', business.description or '') }}</textarea>

</div>


<!-- شماره تماس -->

<div class="field">

<label>
    شماره تماس
</label>

<input
    type="tel"
    id="phone"
    name="phone"
    value="{{ request.form.get('phone', business.phone or '') }}"
    placeholder="02112345678"
>

</div>


<!-- آدرس -->

<div class="field field-full">

<label>
    آدرس
</label>

<textarea
    id="address"
    name="address"
    placeholder="آدرس کسب‌وکار..."
>{{ request.form.get('address', business.address or '') }}</textarea>

</div>


</div>


<div class="form-actions">

<button type="submit">
    💾 ذخیره تغییرات
</button>

</div>


</form>


</div>


</div>

</body>

</html>
